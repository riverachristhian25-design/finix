<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Pegantes Finix (uso interno)</title>
<style>
  :root{ --paper:#FFFFFF; --paper-soft:#F8F6FB; --ink:#211D2B; --body-c:#5C5668; --line:#E7E2F0; --brand:#4E2E85; }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper-soft); font-family:Inter,system-ui,sans-serif; color:var(--ink); }
  form{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px 28px; width:100%; max-width:340px; }
  h1{ font-size:18px; margin:0 0 18px; text-transform:uppercase; letter-spacing:.02em; }
  label{ display:block; font-size:12.5px; font-weight:700; margin:14px 0 5px; }
  input{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; }
  button{ margin-top:20px; width:100%; padding:11px; border:none; border-radius:999px; background:var(--brand); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  button:hover{ opacity:.9; }
  .err{ margin-top:12px; font-size:13px; color:#b3261e; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Acceso interno</h1>
  <label>Usuario</label>
  <input type="text" id="username" autocomplete="username" required>
  <label>Contraseña</label>
  <input type="password" id="password" autocomplete="current-password" required>
  <button type="submit">Ingresar</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error || 'No se pudo ingresar.'; return; }
    window.location.href = '/admin/generador-productos.html';
  } catch (err) {
    errEl.textContent = 'Error de conexión: ' + err.message;
  }
});
</script>
</body>
</html>
